
name: Build Redmi 12C (Project Infinity X A16)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device
  DEVICE_NAME: "redmi12c"
  DEVICE_CODENAME: "earth"

  # Kernel source
  KERNEL_SOURCE: "https://github.com/LineageOS/android_kernel_xiaomi_earth.git"
  KERNEL_BRANCH: "lineage-23.2"

  # Toolchain: mengikuti pola template Redmi Note 7
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD=ld.lld LLVM=1 LLVM_IAS=1"

  CLANG_SOURCE: "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-Linux-X64.tar.xz"
  CLANG_BRANCH: ""

  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/x86/x86_64-linux-android-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  # Defconfig
  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "earth_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # BakaSU
  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "bakasu"
  KERNELSU_METHOD: "shell"

  # SUSFS
  SUSFS_ENABLE: true
  SUSFS_FIXED: false

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  # AnyKernel3
  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"
  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false

  # ROM metadata
  ROM_TEXT: "infinityx_a16"

  # Optional features
  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  # Hook and patch audit
  HOOK_METHOD: "syscall"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "mediatek"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"
  PYTHON_VERSION: "3"

jobs:
  build-kernel:
    name: Redmi 12C earth - Infinity X A16
    runs-on: ubuntu-24.04

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare compilation environment
        uses: ./.github/workflows/build-env

      - name: Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: Apply SUSFS patches
        uses: ./.github/workflows/patch-susfs

      - name: Apply no-kprobe patches
        uses: ./.github/workflows/patch-no-kprobe

      - name: Extra kernel options
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"

          test -f "arch/arm64/configs/${DEFCONFIG_NAME}"

          echo "Device: ${DEVICE_CODENAME}"
          echo "Defconfig: ${DEFCONFIG_NAME}"
          echo "Kernel version:"
          make ARCH=arm64 kernelversion

          echo "Reviewing root and hook configuration:"
          grep -nE 'CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KSU_KPROBES_HOOK|CONFIG_KSU_LSM_SECURITY_HOOKS' \
            "arch/arm64/configs/${DEFCONFIG_NAME}" || true

      - name: Patch Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: Patch Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: Patch Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: Patch NoMount
        uses: ./.github/workflows/patch-nomount

      - name: Build kernel
        uses: ./.github/workflows/build-process

      - name: Package AnyKernel3
        uses: ./.github/workflows/pack-process

      - name: Upload build artifacts
        uses: ./.github/workflows/upload-files
